<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Chat</title>
  <!-- Fraunces display serif — loads async, Georgia fallback if no internet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,400&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ── Entry screen ─────────────────────────────────────── -->
  <div id="entry-screen">

    <!-- Matisse cutout shapes scattered in the background -->
    <div class="entry-shapes" aria-hidden="true">
      <span class="es es-1"></span>
      <span class="es es-2"></span>
      <span class="es es-3"></span>
      <span class="es es-4"></span>
      <span class="es es-5"></span>
      <span class="es es-6"></span>
    </div>

    <div class="entry-card">
      <div class="entry-color-bar"></div>

      <h1 class="entry-title">Local Chat</h1>
      <p class="entry-sub">what's your name?</p>

      <div class="name-row">
        <input
          id="name-input"
          type="text"
          maxlength="20"
          placeholder="Your name…"
          autocomplete="off"
          spellcheck="false"
        >
        <button id="enter-btn" disabled>Enter →</button>
      </div>

      <p id="entry-error" class="entry-error" aria-live="polite"></p>
    </div>
  </div>

  <!-- ── Game screen ──────────────────────────────────────── -->
  <div id="game-screen" class="hidden">
    <div class="game-layout">

      <!-- Full-screen canvas (sized at runtime by game.js) -->
      <div class="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="bubble-layer"></div>

        <!-- Mobile notice — shown only on touch devices -->
        <div id="mobile-notice" class="mobile-notice hidden">
          ⌨ Movement uses keyboard — not available on mobile
        </div>
      </div>

    </div>
  </div>

  <!-- Chat overlay — fixed bottom-left; hidden until game starts -->
  <div class="chat-panel chat-overlay hidden">
    <div class="chat-header">
      <span class="chat-header-dot"></span>
      chat
    </div>
    <div id="chat-log" class="chat-log"></div>
    <div class="chat-input-row">
      <input
        id="chat-input"
        type="text"
        maxlength="200"
        placeholder="Say something…"
        autocomplete="off"
      >
      <button id="send-btn">Send</button>
    </div>
  </div>

  <!-- Minimap overlay — fixed top-right; hidden until game starts -->
  <canvas id="minimap-canvas" class="hidden" width="240" height="135"></canvas>

  <!-- Scripts — world and physics loaded first (shared constants) -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/world.js"></script>
  <script src="/js/physics.js"></script>
  <script src="/js/prng.js"></script>
  <script src="/js/blob.js"></script>
  <script src="/js/entry.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/renderer.js"></script>
  <script src="/js/input.js"></script>
  <script src="/js/minimap.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
